<!DOCTYPE html>
<html>

<head>

    <title>Settings</title>

    <meta charset="UTF-8">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        * {

            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }

        body {

            background: #020617;
            color: white;
            display: flex;
        }

        .sidebar {

            width: 240px;
            height: 100vh;

            background: #081028;

            padding: 20px;
        }

        .sidebar h2 {

            color: #38bdf8;
            margin-bottom: 30px;
        }

        .sidebar ul {

            list-style: none;
        }

        .sidebar li {

            padding: 15px;
            margin-bottom: 15px;

            background: #1e293b;

            border-radius: 12px;
        }

        .sidebar a {

            color: white;
            text-decoration: none;
        }

        .main {

            flex: 1;
            padding: 40px;
        }

        h1 {

            color: #38bdf8;
            margin-bottom: 30px;
        }

        .settings-grid {

            display: grid;

            grid-template-columns:
            repeat(auto-fit, minmax(250px,1fr));

            gap: 25px;
        }

        .card {

            background: #1e293b;

            padding: 30px;

            border-radius: 20px;

            text-align: center;

            transition: 0.3s;

            box-shadow:
            0 0 20px rgba(56,189,248,0.1);
        }

        .card:hover {

            transform: translateY(-5px);

            box-shadow:
            0 0 25px rgba(56,189,248,0.3);
        }

        .card i {

            font-size: 45px;

            margin-bottom: 20px;

            color: #38bdf8;
        }

        .card h3 {

            margin-bottom: 20px;
        }

        .btn {

            display: inline-block;

            padding: 12px 20px;

            border-radius: 10px;

            text-decoration: none;

            color: black;

            font-weight: bold;

            background: #38bdf8;

            transition: 0.3s;
        }

        .btn:hover {

            box-shadow:
            0 0 20px #38bdf8;
        }

        .danger {

            background: #ef4444;
            color: white;
        }

    </style>

</head>

<body>

    <div class="sidebar">

        <h2>RPI DASH</h2>

        <ul>

            <li><a href="/dashboard">
            <i class="fa-solid fa-chart-line"></i>
            Dashboard</a></li>

            <li><a href="/memory">
            <i class="fa-solid fa-memory"></i>
            Memory Stats</a></li>

            <li><a href="/network">
            <i class="fa-solid fa-network-wired"></i>
            Network Info</a></li>

            <li><a href="/logs">
            <i class="fa-solid fa-file-lines"></i>
            System Logs</a></li>

            <li><a href="/settings">
            <i class="fa-solid fa-gear"></i>
            Settings</a></li>

            <li>

                <a href="/camera" class="nav-link">
            
                    <i class="fa-solid fa-video"></i>
            
                    Camera Stream
            
                </a>
            
            </li>

        </ul>

    </div>

    <div class="main">

        <h1>Settings</h1>

        <div class="settings-grid">

            <div class="card">

                <i class="fa-solid fa-right-from-bracket"></i>

                <h3>Logout</h3>

                <a href="/logout" class="btn">

                    Logout

                </a>

            </div>

            <div class="card">

                <i class="fa-solid fa-rotate-right"></i>

                <h3>Restart Dashboard</h3>

                <a href="/restart_dashboard"
                class="btn">

                    Restart

                </a>

            </div>

            <div class="card">

                <i class="fa-solid fa-power-off"></i>

                <h3>Reboot Pi</h3>

                <a href="/reboot"
                class="btn danger">

                    Reboot

                </a>

            </div>

            <div class="card">

                <i class="fa-solid fa-skull-crossbones"></i>

                <h3>Shutdown Pi</h3>

                <a href="/shutdown"
                class="btn danger">

                    Shutdown

                </a>

            </div>

        </div>

    </div>

    <script>

        if (performance.navigation.type === 1) {
        
            window.location.href = "/logout";
        
        }
        
        </script>

</body>

</html>

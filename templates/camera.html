<!DOCTYPE html>
<html>

<head>

    <title>Camera Stream</title>

    <style>

        * {

            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family: Arial;
        }

        body {

            background: #020617;

            color: white;

            overflow-x: hidden;
        }

        /* HEADER */

        .header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 20px 40px;

            border-bottom:
                1px solid rgba(56,189,248,0.15);
        }

        .header h1 {

            color: #38bdf8;

            font-size: 38px;

            margin-bottom: 5px;
        }

        .subtext {

            color: #94a3b8;

            font-size: 16px;
        }

        .camera-status {

            display: flex;

            gap: 12px;

            align-items: center;

            flex-wrap: wrap;
        }

        .status {

            padding: 10px 18px;

            border-radius: 12px;

            font-weight: bold;
        }

        .live {

            background:
                rgba(34,197,94,0.15);

            color: #22c55e;

            box-shadow:
                0 0 12px rgba(34,197,94,0.5);
        }

        .status-card {

            background: #1e293b;

            padding: 10px 18px;

            border-radius: 12px;

            color: #cbd5e1;

            border:
                1px solid rgba(56,189,248,0.2);
        }

        /* MAIN LAYOUT */

        .main-layout {

display: flex;

justify-content: flex-start;

align-items: flex-start;

gap: 30px;

margin-top: 40px;

padding: 20px 30px;
}

        /* STREAM */

        .stream-container img {

            width: 700px;

            border-radius: 20px;

            border: 3px solid #131414;

            box-shadow:
                0 0 25px rgba(128, 131, 133, 0.5);
        }

        /* CONTROL PANEL */

        .control-panel {

            display: flex;

            flex-direction: column;

            gap: 20px;
        }

        .control-panel button {

            width: 220px;

            padding: 18px;

            border: none;

            border-radius: 14px;

            background: #1e293b;

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition: 0.3s;

            border:
                1px solid rgba(56,189,248,0.2);

            box-shadow:
                0 0 10px rgba(56,189,248,0.1);
        }

        .control-panel button:hover {

            transform: scale(1.03);

            background: #38bdf8;

            color: black;

            box-shadow:
                0 0 20px #38bdf8;
        }

    </style>

</head>

<body>

    <!-- HEADER -->

    <div class="header">

        <div>

            <h1>

                Surveillance Camera

            </h1>

            <p class="subtext">

                Embedded RTSP Monitoring System

            </p>

        </div>

        <div class="camera-status">

            <div class="status live">

                ● LIVE

            </div>

            <div class="status-card">

                RTSP Connected

            </div>

            <div class="status-card">

                1920x1080

            </div>

            <div class="status-card">

                13 FPS

            </div>

            <div class="status-card">

                H264 Stream

            </div>

        </div>

    </div>

    <!-- MAIN -->

    <div class="main-layout">

        <!-- STREAM -->

        <div class="stream-container">

            <img
    id="cameraStream"
    src="{{ url_for('video_feed') }}?t={{ range(1,999999)|random }}"
>

        </div>

        <!-- CONTROLS -->

        <div class="control-panel">

            <button onclick="captureSnapshot()">

                📸 Capture
            
            </button>

            <button id="fullscreenBtn">

                ⛶ Fullscreen
            
            </button>

            <button id="refreshBtn">

                🔄 Refresh
            
            </button>

        </div>

    </div>

    <script>

        const fullscreenBtn =
            document.getElementById(
                "fullscreenBtn"
            );
    
        const cameraStream =
            document.getElementById(
                "cameraStream"
            );
    
        fullscreenBtn.addEventListener(
            "click",
            () => {
    
                if (
                    cameraStream.requestFullscreen
                ) {
    
                    cameraStream.requestFullscreen();
                }
            }
        );

const refreshBtn =
document.getElementById(
    "refreshBtn"
);

refreshBtn.addEventListener(
"click",
() => {

    location.reload();
}
);

function captureSnapshot() {

fetch('/capture')
.then(response => response.blob())
.then(blob => {

    const url =
        window.URL.createObjectURL(blob);

    const a =
        document.createElement('a');

    a.href = url;

    a.download =
        'snapshot.jpg';

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    window.URL.revokeObjectURL(url);
});
}

</script>

</body>

</html>
